{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" class="page-link">← Précédent</a>
    {% else %}
        <span class="page-link disabled">← Précédent</span>
    {% endif %}

    <span class="page-current">Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" class="page-link">Suivant →</a>
    {% else %}
        <span class="page-link disabled">Suivant →</span>
    {% endif %}
</nav>
{% endif %}
