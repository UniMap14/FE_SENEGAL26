{% load static %}
<div class="hero-slider">
    {% for img in hero_images %}
        <div class="hero-slide{% if forloop.first %} active{% endif %}" style="background-image:url('{% static img %}');"></div>
    {% endfor %}
</div>

{% if hero_images|length > 1 %}
<button type="button" class="hero-arrow prev" aria-label="Photo précédente">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button type="button" class="hero-arrow next" aria-label="Photo suivante">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>

<div class="hero-dots">
    {% for img in hero_images %}
        <button type="button" class="hero-dot{% if forloop.first %} active{% endif %}" aria-label="Photo {{ forloop.counter }}"></button>
    {% endfor %}
</div>
{% endif %}
